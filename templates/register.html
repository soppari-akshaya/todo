<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f7;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;
        }

        .auth-box {
            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .logo {
            width: 45px;

            height: 45px;

            background: #52d273;

            color: white;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 14px;
        }

        .auth-button {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: #222;

            color: white;

            cursor: pointer;

            font-size: 15px;
        }

        .auth-button:hover {
            background: #444;
        }

        .error {
            color: #d9534f;

            background: #fff0f0;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 15px;

            font-size: 14px;
        }

        .bottom-text {
            text-align: center;

            margin-top: 20px;

            color: #777;

            font-size: 14px;
        }

        a {
            color: #25a95a;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="auth-box">

     

    <h1>Create Account</h1>

    <p class="subtitle">
        Create your To-Do account
    </p>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">

        <label>
            Name
        </label>

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <button
            type="submit"
            class="auth-button"
        >
            Create Account
        </button>

    </form>


    <p class="bottom-text">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </p>

</div>

</body>

</html>
